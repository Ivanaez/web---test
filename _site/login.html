<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/css/login.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


  <title>Login</title>
</head>
<body>
  
<!-- Auth card wrapper (styled in desktop breakpoint) -->
<div class="auth-card">

                     <!-- Login container -->
<main class="login">
                     <!-- Logo image -->
  <img class="logo" src="/img/logo.png" alt="PizzaHub logo">

                <!-- Text wrapper container -->
<header class="login-text">

                      <!-- Text-h1 -->
  <h1 class="title">Sign in </h1>
                     <!-- Text-p -->
  <p class="sub-title">Join us and make your next order easier.</p>

</header>

<!-- Form -->
<form class="login-container" action="/login" method="post" >

    <!-- Email input -->
  <div class="email">
    <!-- email label (hidden) -->
  <label class="visually-hidden" for="email">Email</label> 
  <!-- email span icon -->
  <span class="input-icon left"  aria-hidden="true" > 
     <i class="fa-regular fa-envelope"></i>
  </span>
    <!-- email input field -->
  <input
    type="email"
    id="email"
    name="email"
    placeholder="Email"
    autocomplete="email"
    required
  >
  </div>
           

        <!-- Password input -->
  <div class="password">
    <!-- email label (hidden) -->
    <label class="visually-hidden" for="password">Password</label>
    <!-- lock span icon -->
    <span class="input-icon left" aria-hidden="true">
     <i class="fa-solid fa-lock"></i>
    </span>  
    <!-- password input field -->
  <input
    type="password"
    id="password"
    name="password"
    placeholder="Password"
    autocomplete="current-password"
    required
  >
                    <!-- eye span icon -->
    
<button
  type="button"
  class="input-icon right toggle-password eye-icon-hidden"
  aria-label="Show password"
>
  <i class="fa-regular fa-eye-slash"></i>
</button>
    
  </div>

  <!-- Password validation error message -->
    <p class="error password-error hidden"></p>

                         <!-- Forgot password link -->
     <a class="forgot-password" href="/forgot-password/">Forgot password?</a>



                <!-- Login action button -->
    <button type="submit" class="login-btn" >Login</button>

</form>
                    <!-- Secondary section -->
<div class="secondary">

                  <!-- text new here -->
<p class="new-here"><span>New here?</span></p>

<!-- Create account link (leads to account creation page) -->
<a href="/create-account/" class="link-btn create-account">
    Create Account
  </a>

<!-- Divider between account creation and guest access -->
  <div class="or-divider"><span>Or</span></div>
  
<!-- Continue without creating an account -->
   <a href="/guest/" class="link-btn guest">
    Continue as Guest
  </a>

<!-- Security and privacy information -->
  <p class="security-text">
    We never share your data · <span>Secure login</span>
  </p>

</div>
</main>
</div>






  <script src="/js/login.js"></script>
</body>
</html>
