<!doctype html>
<html lang="bg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/css/login.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


  <title>Login</title>
</head>
<body>
                       <!-- Login container -->
<div class="login">
                     <!-- Logo image -->
  <img class="logo" src="/img/logo.png" alt="PizzaHub logo">

                <!-- Text wrapper container -->
<div class="login-text">

                      <!-- Text-h1 -->
  <h1 class="title">Sign in to your account</h1>

                     <!-- Text-p -->
  <p class="sub-title">Glad to see you again.</p>

</div>
<!-- Login container -->
<div class="login-container">

    <!-- Email input -->
  <div class="email">

        <!-- email span icon -->
    <span class="input-icon left">
     <i class="fa-regular fa-envelope"></i>
    </span>

     <!-- email input field -->
    <input type="email" placeholder="Email">
  </div>

        <!-- Password input -->
  <div class="password">

                 <!-- lock span icon -->
    <span class="input-icon left">
     <i class="fa-solid fa-lock"></i>
    </span>
      
    <input type="password" placeholder="Password">
                    <!-- eye span icon -->
    <span class="input-icon right">
        <i class="fa-regular fa-eye"></i>
    </span>
    
  </div>
                         <!-- Forgot password link -->
     <a class="forgot-password" href="/forgot-password/">Forgot password?</a>

</div><!-- Login container </div> -->

                <!-- Login action button -->
    <button type="submit" class="login-btn">Login</button>

                    <!-- Secondary section -->
<div class="secondary">
  
                  <!-- text new here -->
<p class="new-here"><span>New here?</span></p>
  
  
    

</div>
</div>




  <script src="/js/login.js"></script>
</body>
</html>
